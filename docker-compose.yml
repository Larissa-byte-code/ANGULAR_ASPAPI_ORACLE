#Décrit comment lancer plusieurs conteneurs ensemble (front + back + base de données).

version: '3.8'
services:
  api:
    build: ./SmarketApiOracle      # ton back ASP.NET Core
    container_name: SmarketApiOracle
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  front:
    build: ./MonAngular            # ton front Angular
    container_name: MonAngular
    ports:
      - "4200:80"

  nginx:
    image: nginx:latest
    container_name: MonNginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - front
