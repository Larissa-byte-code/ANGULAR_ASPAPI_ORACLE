name: CI/CD Pipeline

on:
  push:
    branches:
      - main          # déploiement en prod
      - develop       # intégration continue
      - 'feature/*'   # build des features
      - 'release/*'   # build des releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout
        uses: actions/checkout@v3

      # 2️⃣ Build du front Angular (MonAngular)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Build Angular
        run: |
          cd MonAngular
          npm install
          npm run build --prod

      # 3️⃣ Build du back ASP.NET Core (SmarketApiOracle)
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      - name: Build ASP.NET Core API
        run: |
          cd SmarketApiOracle
          dotnet restore
          dotnet build --configuration Release

      # 4️⃣ Docker login (seulement pour develop/main/release)
      - name: Docker login
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release') || github.ref == 'refs/heads/develop'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build & Push images Docker
      - name: Build & Push Front (MonAngular)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release') || github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v4
        with:
          context: ./MonAngular
          push: true
          tags: moncompte/monangular:${{ github.ref_name }}

      - name: Build & Push Back (SmarketApiOracle)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release') || github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v4
        with:
          context: ./SmarketApiOracle
          push: true
          tags: moncompte/smarketapioracle:${{ github.ref_name }}
