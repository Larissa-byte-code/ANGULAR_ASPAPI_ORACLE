<div class="container mt-4">
  <h2 class="mb-4 text-primary">Gestion des Catégories</h2>

  <!-- Message -->
  <div *ngIf="message" [class]="isError ? 'alert alert-danger' : 'alert alert-success'" class="mb-3">
    {{ message }}
  </div>

  <!-- Formulaire Ajout -->
  <form *ngIf="!editCategory" (ngSubmit)="create()" #catForm="ngForm" class="card shadow-sm p-4 mb-4">
    <h4 class="mb-3">➕ Ajouter une catégorie</h4>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nom</label>
        <input [(ngModel)]="newCategory.catName" name="catName" placeholder="Nom de la catégorie" class="form-control" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Description</label>
        <input [(ngModel)]="newCategory.catDes" name="catDes" placeholder="Description" class="form-control" required />
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-success px-4">Ajouter</button>
      </div>
    </div>
  </form>

  <!-- Formulaire Edition -->
  <form *ngIf="editCategory" (ngSubmit)="update()" #editForm="ngForm" class="card shadow-sm p-4 mb-4 border-warning">
    <h4 class="text-warning mb-3">✏️ Modifier la catégorie</h4>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nom</label>
        <input [(ngModel)]="editCategory.catName" name="editCatName" placeholder="Nom" class="form-control" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Description</label>
        <input [(ngModel)]="editCategory.catDes" name="editCatDes" placeholder="Description" class="form-control" required />
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-warning me-2">Modifier</button>
        <button type="button" (click)="cancelEdit()" class="btn btn-secondary">Annuler</button>
      </div>
    </div>
  </form>

  <!-- Tableau -->
  <div class="card shadow-sm">
    <table class="table table-hover mb-0">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Code</th>
          <th>Nom</th>
          <th>Description</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of categories">
          <td>{{ cat.catId }}</td>
          <td>{{ cat.catIdvC }}</td>
          <td>{{ cat.catName }}</td>
          <td>{{ cat.catDes }}</td>
          <td class="text-center">
            <button type="button" (click)="startEdit(cat)" class="btn btn-sm btn-outline-warning me-2">✏️ Edit</button>
            <button type="button" (click)="delete(cat.catId!)" class="btn btn-sm btn-outline-danger">🗑 Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
