<main class="register">
  <form class="carte register__carte" (ngSubmit)="onRegister()" novalidate>
    <h2 class="register__titre">Inscription</h2>

    <!-- Message d'erreur -->
    <div *ngIf="erreur" class="alert alert-danger mb-3" role="alert">
      {{ erreur }}
    </div>

    <div class="champ">
      <label for="username">Nom d’utilisateur</label>
      <input id="username" [(ngModel)]="username" name="username" placeholder="Nom d’utilisateur"
             required class="form-control" [disabled]="enCours" />
    </div>

    <div class="champ">
      <label for="email">Email</label>
      <input id="email" [(ngModel)]="email" name="email" type="email" placeholder="Email"
             required class="form-control" [disabled]="enCours" />
    </div>

    <div class="champ">
      <label for="password">Mot de passe</label>
      <input id="password" [(ngModel)]="password" name="password" type="password" placeholder="Mot de passe"
             required class="form-control" [disabled]="enCours" />
    </div>

    <button type="submit" class="bouton bouton--primaire register__valider"
            [disabled]="enCours">
      {{ enCours ? 'Inscription…' : 'S’inscrire' }}
    </button>
  </form>
</main>
